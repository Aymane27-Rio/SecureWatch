name: Feature request
description: Suggest an improvement or a new SecureWatch capability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem and the outcome you want. Avoid including private host data or credentials.
  - type: dropdown
    id: persona
    attributes:
      label: Who would this help most?
      options:
        - Standard user
        - Developer
        - Pentester
        - System administrator
        - Other or multiple personas
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Explain the task or difficulty in your own words.
    validations:
      required: true
  - type: textarea
    id: proposed-outcome
    attributes:
      label: What outcome would you like?
      description: Describe what SecureWatch should let you do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or context
      description: Mention workarounds, platforms, or deployment needs that may help us understand the request.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets and unnecessary host-specific details from this request.
          required: true
