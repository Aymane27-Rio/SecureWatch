# SecureWatch configuration
BASE_DIR="${BASE_DIR:-$(pwd)}"
LOG_DIR="${LOG_DIR:-$BASE_DIR/data/logs}"
REPORT_DIR="${REPORT_DIR:-$BASE_DIR/data/reports}"
STATE_DIR="${STATE_DIR:-$BASE_DIR/data/state}"

SSH_FAILED_THRESHOLD="${SSH_FAILED_THRESHOLD:-5}"
if [[ -z "${INTEGRITY_BASELINE:-}" ]]; then
  if [[ "$EUID" -eq 0 ]]; then
    INTEGRITY_BASELINE="/var/lib/securewatch/state/integrity-baseline.json"
  else
    INTEGRITY_BASELINE="$STATE_DIR/integrity-baseline.json"
  fi
fi
