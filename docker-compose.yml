services:
  exporter:
    build: .
    command: ["python3", "python/exporters/securewatch_exporter.py"]
    user: "${SECUREWATCH_UID:-1000}:${SECUREWATCH_GID:-1000}"
    expose:
      - "9109"
    read_only: true
    cap_drop:
      - ALL
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/logs:/app/data/logs:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:9109/metrics', timeout=2).read(1)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      WEBAPI_API_KEY: ${WEBAPI_API_KEY:?Create .env using the setup command in README.md}
    depends_on:
      webapi:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.16.0
    ports:
      - "127.0.0.1:9090:9090"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-storage:/prometheus
    restart: unless-stopped
    depends_on:
      exporter:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:9090/-/healthy
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:13.3.1
    ports:
      - "127.0.0.1:3001:3000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/log/grafana
    volumes:
      - grafana-storage:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Add GRAFANA_ADMIN_PASSWORD to .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:3000/api/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  webapi:
    build:
      context: .
      dockerfile: webapi/Dockerfile
    user: "${SECUREWATCH_UID:-1000}:${SECUREWATCH_GID:-1000}"
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    volumes:
      - ./data/logs:/app/data/logs:ro
      - ./data/state:/app/data/state
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      WEBAPI_DB_PATH: /app/data/state/securewatch.db
      WEBAPI_LOGS_DIR: /app/data/logs
      WEBAPI_API_KEY: ${WEBAPI_API_KEY:?Create .env using the setup command in README.md}
      WEBAPI_ALLOW_SCAN: "0"
      WEBAPI_INGEST_INTERVAL: "60"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/hello', timeout=2).read(1)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  alternate-api:
    profiles:
      - alternate-api
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "${SECUREWATCH_UID:-1000}:${SECUREWATCH_GID:-1000}"
    ports:
      - "127.0.0.1:8001:8000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/logs:/app/data/logs:ro
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      WEBAPI_API_KEY: ${WEBAPI_API_KEY:?Create .env using the setup command in README.md}
      SECUREWATCH_LOG_DIR: /app/data/logs
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os; from urllib.request import Request, urlopen; request=Request('http://127.0.0.1:8000/api/metrics', headers={'X-API-Key':os.environ['WEBAPI_API_KEY']}); urlopen(request, timeout=2).read(1)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s



volumes:
  grafana-storage:
  prometheus-storage:
