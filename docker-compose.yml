services:
  exporter:
    build: .
    ports:
      - "${SECUREWATCH_BIND_ADDRESS:-127.0.0.1}:9109:9109"
    volumes:
      - ./data:/app/data
  frontend:
    build: ./frontend
    ports:
      - "${SECUREWATCH_BIND_ADDRESS:-127.0.0.1}:3000:80"
    depends_on:
      - webapi

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${SECUREWATCH_BIND_ADDRESS:-127.0.0.1}:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - exporter

  grafana:
    image: grafana/grafana-oss:latest
    ports:
      - "${SECUREWATCH_BIND_ADDRESS:-127.0.0.1}:3001:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus

  webapi:
    build:
      context: .
      dockerfile: webapi/Dockerfile
    ports:
      - "${SECUREWATCH_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      WEBAPI_DB_PATH: /app/data/state/securewatch.db
      WEBAPI_LOGS_DIR: /app/data/logs
      WEBAPI_API_KEY: ${WEBAPI_API_KEY:-}
      WEBAPI_ALLOW_SCAN: "0"
      WEBAPI_INGEST_INTERVAL: "60"



volumes:
  grafana-storage:
