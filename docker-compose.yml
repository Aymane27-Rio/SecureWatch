services:
  exporter:
    build: .
    volumes:
      - ./data:/app/data
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    environment:
      WEBAPI_API_KEY: ${WEBAPI_API_KEY:?Create .env using the setup command in README.md}
    depends_on:
      - webapi

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - exporter

  grafana:
    image: grafana/grafana-oss:latest
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus

  webapi:
    build:
      context: .
      dockerfile: webapi/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      WEBAPI_DB_PATH: /app/data/state/securewatch.db
      WEBAPI_LOGS_DIR: /app/data/logs
      WEBAPI_API_KEY: ${WEBAPI_API_KEY:?Create .env using the setup command in README.md}
      WEBAPI_ALLOW_SCAN: "0"
      WEBAPI_INGEST_INTERVAL: "60"



volumes:
  grafana-storage:
